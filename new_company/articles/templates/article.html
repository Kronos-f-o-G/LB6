{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="header">
        <img src="{% static 'image.png' %}" alt="duck">
        <a href="{% url 'archive' %}" class="all-posts-link">Все статьи</a>
        <div class="header-flex" style="position: absolute; top: 0; right: 0;">
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <a href="{% url 'create_post' %}" style="color: white; margin-left: 15px;">+ Новая перевозка</a>
            <a href="{% url 'logout' %}" style="color: white; margin-left: 15px;">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}" style="color: white; margin-right: 15px;">Войти</a>
            <a href="{% url 'register' %}" style="color: white;">Регистрация</a>
        {% endif %}
    </div>
    </div>
    <h1>Маршрут</h1>
    <div class="archive">
        <div class="one-post">
            <h2 class="post-title">{{ post.title }}</h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <!-- Полный текст перевозки -->
            <p class="article-text">{{ post.text }}</p>
        </div>
    </div>
</body>
</html>
